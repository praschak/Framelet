name: Universal macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build Universal 2 app
        env:
          FRAMELET_UNIVERSAL: '1'
        run: ./build-command-line.sh
      - name: Verify and package
        run: |
          lipo -verify_arch arm64 x86_64 build/Framelet.app/Contents/MacOS/Framelet
          codesign --verify --deep --strict build/Framelet.app
          ditto -c -k --sequesterRsrc --keepParent build/Framelet.app build/Framelet-Universal.zip
          cd build
          shasum -a 256 Framelet-Universal.zip > Framelet-Universal.zip.sha256
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Framelet-Universal
          path: |
            build/Framelet-Universal.zip
            build/Framelet-Universal.zip.sha256
          if-no-files-found: error
